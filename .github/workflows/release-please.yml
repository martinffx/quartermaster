name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Ask the module proxy for the new tag so pkg.go.dev indexes it right away.
      - name: Prime pkg.go.dev
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: curl -fsS "https://proxy.golang.org/github.com/martinffx/quartermaster/@v/${TAG}.info"
