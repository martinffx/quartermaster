name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          # PRs opened with GITHUB_TOKEN don't trigger CI, so the required checks never
          # run on the release PR. Add a RELEASE_PLEASE_TOKEN secret (a fine-grained PAT
          # with contents and pull-requests write) to fix that; until then this falls
          # back to GITHUB_TOKEN.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # Ask the module proxy for the new tag so pkg.go.dev indexes it right away.
      - name: Prime pkg.go.dev
        if: ${{ steps.release.outputs.release_created }}
        env:
          TAG: ${{ steps.release.outputs.tag_name }}
        run: curl -fsS "https://proxy.golang.org/github.com/martinffx/quartermaster/@v/${TAG}.info"
